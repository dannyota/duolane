name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Released vMAJOR.MINOR.PATCH tag
        required: true
        type: string
      publish:
        description: Publish to crates.io after preflight and owner approval
        default: false
        type: boolean

concurrency:
  group: publish-crates
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'dannyota/duolane' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.validate.outputs.commit }}
      toolchain: ${{ steps.validate.outputs.toolchain }}
    steps:
      - name: Require exact main ref
        run: |
          test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the release tag
        id: resolve
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected a vMAJOR.MINOR.PATCH release tag' >&2
            exit 1
          fi
          commit=$(git rev-parse --verify --end-of-options "refs/tags/$TAG^{commit}")
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$commit" "$GITHUB_SHA"
          metadata=$(mktemp -d "$RUNNER_TEMP/crate-release.XXXXXX")
          artifacts=$(mktemp -d "$RUNNER_TEMP/crate-artifacts.XXXXXX")
          git show "$commit:Cargo.toml" > "$metadata/Cargo.toml"
          git ls-tree -r --full-tree -z "$commit" > "$metadata/tree"
          printf 'commit=%s\nmetadata=%s\nartifacts=%s\n' "$commit" "$metadata" "$artifacts" >> "$GITHUB_OUTPUT"
      - name: Read GitHub release and run metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ steps.resolve.outputs.commit }}
          METADATA: ${{ steps.resolve.outputs.metadata }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable,assets > "$METADATA/release.json"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$TAG" --commit "$COMMIT" \
            --event push --status success --limit 1 --json databaseId,headBranch,headSha,conclusion,event > "$METADATA/runs.json"
          run_id=$(jq -er --arg tag "$TAG" --arg commit "$COMMIT" '
            select(length == 1) | .[0]
            | select(.headBranch == $tag and .headSha == $commit and .conclusion == "success" and .event == "push")
            | .databaseId | select(type == "number")
          ' "$METADATA/runs.json")
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          printf 'run-id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.release.outputs.run-id }}
          path: ${{ steps.resolve.outputs.artifacts }}
          pattern: '{darwin-arm64,linux-amd64,linux-arm64,windows-amd64}'
          merge-multiple: false
      - name: Read registry metadata
        env:
          TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
          METADATA: ${{ steps.resolve.outputs.metadata }}
        run: |
          api=https://crates.io/api/v1/crates/duolane
          request=(curl --silent --show-error --proto '=https' --max-time 30 --max-filesize 1048576
                   --user-agent release-ci --write-out '%{http_code}')
          status=$("${request[@]}" --output "$METADATA/owners.json" "$api/owners")
          test "$status" = 200
          if [[ "$PUBLISH" == true ]]; then
            jq -e '.isImmutable == true' "$METADATA/release.json" > /dev/null
            status=$("${request[@]}" --output /dev/null "$api/${TAG#v}")
            if [[ "$status" != 404 ]]; then
              echo 'Publishing requires HTTP 404 for the exact crate version' >&2
              exit 1
            fi
          fi
      - name: Validate metadata and install pinned Rust
        id: validate
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ steps.resolve.outputs.commit }}
          METADATA: ${{ steps.resolve.outputs.metadata }}
          ARTIFACTS: ${{ steps.resolve.outputs.artifacts }}
        run: |
          python3 -I scripts/check-crate-release.py "$TAG" "$COMMIT" "$METADATA/Cargo.toml" \
            "$METADATA/release.json" "$METADATA/runs.json" "$METADATA/owners.json" "$ARTIFACTS" "$METADATA/tree"
          toolchain=$(git show "$COMMIT:rust-toolchain.toml" | python3 -I -c '
          import re, sys, tomllib
          version = tomllib.load(sys.stdin.buffer)["toolchain"]["channel"]
          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              sys.exit("Expected a numeric Rust toolchain pin")
          print(version)
          ')
          rustup toolchain install "$toolchain" --profile minimal
          printf 'commit=%s\ntoolchain=%s\n' "$COMMIT" "$toolchain" >> "$GITHUB_OUTPUT"
      - name: Compile the package without publishing
        env:
          COMMIT: ${{ steps.validate.outputs.commit }}
          TOOLCHAIN: ${{ steps.validate.outputs.toolchain }}
        run: |
          git checkout --detach "$COMMIT"
          cargo "+$TOOLCHAIN" publish --dry-run --locked --registry crates-io --package duolane

  publish:
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'dannyota/duolane' &&
      github.ref == 'refs/heads/main' && inputs.publish && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Verify owner approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_PROTECTED" = true
          environment_id=$(gh api "repos/$GITHUB_REPOSITORY/environments/crates-io" | jq -esr '
            select(length == 1) | .[0] | objects
            | select(.name == "crates-io" and any(
              .protection_rules | arrays | .[] | objects | select(.type == "required_reviewers")
              | .reviewers | arrays | .[] | objects;
              .type == "User" and .reviewer.login == "dannyota"
            )) | .id | numbers
          ')
          [[ "$environment_id" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" |
            jq -es --argjson id "$environment_id" '
              select(length == 1) | .[0] | arrays | any(.[] | objects;
              .state == "approved" and .user.login == "dannyota" and
              any(.environments | arrays | .[] | objects; .id == $id and .name == "crates-io")
            )' > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Check tagged checkout and prepare Cargo
        id: prepare
        env:
          COMMIT: ${{ needs.verify.outputs.commit }}
          TOOLCHAIN: ${{ needs.verify.outputs.toolchain }}
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT"
          [[ -f Cargo.toml && ! -L Cargo.toml ]]
          modes=$(git ls-files --format='%(objectmode)')
          if grep -qx '120000' <<< "$modes"; then
            echo 'Publishing requires a checkout without tracked symlinks' >&2
            exit 1
          fi
          if [[ -L .cargo || -e .cargo/config || -L .cargo/config || -e .cargo/config.toml || -L .cargo/config.toml ]]; then
            echo 'Publishing requires a checkout without Cargo configuration' >&2
            exit 1
          fi
          [[ "$TOOLCHAIN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          cargo_home=$(mktemp -d "$RUNNER_TEMP/crate-cargo-home.XXXXXX")
          printf 'cargo-home=%s\n' "$cargo_home" >> "$GITHUB_OUTPUT"
      - name: Exchange OIDC for a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the crate
        env:
          CARGO_HOME: ${{ steps.prepare.outputs.cargo-home }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          TOOLCHAIN: ${{ needs.verify.outputs.toolchain }}
        run: |
          exec cargo "+$TOOLCHAIN" publish --no-verify --locked --registry crates-io --package duolane \
            --config 'registry.credential-provider="cargo:token"'
