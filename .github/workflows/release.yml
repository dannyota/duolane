name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  BIN_NAME: duolane

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: |
          version="$(tr -d '\r' < rust-toolchain.toml | sed -n 's/^channel = "\(.*\)"$/\1/p')"
          test -n "$version"
          rustup toolchain install "$version" --profile minimal --component rustfmt,clippy
          test "$(rustc --version | cut -d ' ' -f 2)" = "$version"
      - name: Read the cargo-deny pin
        run: echo "CARGO_DENY=$(tr -d '\r' < .tool-versions | awk '$1 == "cargo-deny" { print $2 }')" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@${{ env.CARGO_DENY }}
          fallback: none
      - name: Dependency policy
        run: cargo deny --locked check
      - name: Test
        run: cargo test --locked -- --test-threads=1

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
            ext: ""
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-amd64
            ext: ""
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-amd64
            ext: ""
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            ext: ""
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-amd64
            ext: .exe
            archive: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows-arm64
            ext: .exe
            archive: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      ARCHIVE: ${{ matrix.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        shell: bash
        run: |
          version="$(tr -d '\r' < rust-toolchain.toml | sed -n 's/^channel = "\(.*\)"$/\1/p')"
          test -n "$version"
          rustup toolchain install "$version" --profile minimal --component rustfmt,clippy --target "$TARGET"
          test "$(rustc --version | cut -d ' ' -f 2)" = "$version"
      - name: Build
        shell: bash
        run: cargo build --release --locked --target "$TARGET"
      - name: Verify Unix binary
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          expected="duolane ${VERSION#v}"
          actual="$("target/$TARGET/release/$BIN_NAME" --version)"
          test "$actual" = "$expected"
      - name: Verify Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $expected = "duolane $($env:VERSION.TrimStart('v'))"
          $actual = & "target/$($env:TARGET)/release/$($env:BIN_NAME).exe" --version
          if ($actual -ne $expected) {
            Write-Error "expected '$expected', got '$actual'"
          }
      - name: Package Unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/$BIN_NAME" "dist/$BIN_NAME"
          archive="$BIN_NAME-$PLATFORM.$ARCHIVE"
          tar -C dist -czf "$archive" "$BIN_NAME"
          shasum -a 256 "$archive" > "$BIN_NAME-$PLATFORM.sha256"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/$($env:TARGET)/release/$($env:BIN_NAME).exe" "dist/$($env:BIN_NAME).exe"
          $archive = "$($env:BIN_NAME)-$($env:PLATFORM).$($env:ARCHIVE)"
          Compress-Archive -Path "dist/$($env:BIN_NAME).exe" -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          "$hash  $archive" | Out-File -FilePath "$($env:BIN_NAME)-$($env:PLATFORM).sha256" -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: |
            ${{ env.BIN_NAME }}-${{ matrix.platform }}.${{ matrix.archive }}
            ${{ env.BIN_NAME }}-${{ matrix.platform }}.sha256

  smoke-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-amd64
      - shell: pwsh
        run: |
          Expand-Archive duolane-windows-amd64.zip -DestinationPath .
          .\duolane.exe --version

  release:
    needs: [build, smoke-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: notes.md
          fail_on_unmatched_files: true
          files: |
            *.tar.gz
            *.zip
            *.sha256
