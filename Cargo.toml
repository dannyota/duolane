[package]
name = "duolane"
version = "0.11.0"
description = "Run Claude Code on your Claude and ChatGPT subscriptions at once, routed per model"
edition = "2024"
authors = ["Danny"]
license = "MIT"
repository = "https://github.com/dannyota/duolane"
readme = "README.md"
keywords = ["claude-code", "codex", "openai", "anthropic", "gpt"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
anyhow = "1.0"
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
futures-util = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "multipart", "form", "rustls-no-provider", "http2", "socks"] }
base64 = "0.22"
once_cell = "1.20"
regex-lite = "0.1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ring = "0.17.14"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
rustls-native-certs = "0.8"
socket2 = { version = "0.6", features = ["all"] }
webpki-roots = "1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client-proxy", "http1", "server-auto", "server-graceful", "service", "tokio"] }
url = "2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
crossterm = "0.29"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
tiktoken-rs = { version = "0.12", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
rustix = { version = "1", default-features = false, features = ["fs", "process", "termios"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
hyper = { version = "1", features = ["client"] }
tempfile = "3.14"
assert_cmd = "2"
predicates = "3"
