[extend]
useDefault = true

[[allowlists]]
description = "Test JWTs with an HS256 header, a toy account id payload, and the literal signature .sig"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)src/providers/codex/auth/jwt\.rs$''']
regexes = [
  '''^eyJhbGciOiJIUzI1NiJ9\.eyJjaGF0Z3B0X2FjY291bnRfaWQiOiJhY2N0XzEyMyJ9\.sig$''',
  '''^eyJhbGciOiJIUzI1NiJ9\.eyJjaGF0Z3B0X2FjY291bnRfaWQiOiJhY2NfYWNjIn0\.sig$''',
]

[[allowlists]]
description = "The sample Sec-WebSocket-Key from RFC 6455 section 1.3, base64 of 'the sample nonce'"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)src/providers/codex/websocket\.rs$''']
regexes = ['''^dGhlIHNhbXBsZSBub25jZQ==$''']
